<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TAF — JÉSSICA</title>
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAF JÉSSICA">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --line:#2b2b2b;
  --text:#f5f5f5;
  --muted:#bcbcbc;
  --pink:#ff4fa3;
  --pinkLight:#ffc1df;
  --pinkSoft:#3a1327;
  --ok:#3ddc84;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#050505,#111);color:var(--text);min-height:100vh;text-transform:uppercase}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 110px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(7,7,7,.97);backdrop-filter:blur(10px);padding:8px 0 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tab{border:1px solid #6e2d4c;background:linear-gradient(180deg,#341426,#201019);color:var(--pinkLight);border-radius:11px;padding:11px 4px;font-weight:900;font-size:.72rem;cursor:pointer}
.tab.active{background:linear-gradient(180deg,#3ddc84,#21a85f);color:#07130c;border-color:#7ff0ad}
.hero{margin-top:10px;background:linear-gradient(135deg,rgba(255,79,163,.14),rgba(255,79,163,.03) 38%,rgba(0,0,0,.2)),linear-gradient(180deg,#121212,#0c0c0c);border:1px solid #6e2d4c;border-radius:18px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
h1{margin:0 0 12px;font-size:1.55rem;line-height:1.05}
.subtitle{font-size:.74rem;color:var(--pinkLight);font-weight:800;letter-spacing:.08em}
.progress{height:12px;border-radius:999px;background:#232323;overflow:hidden;border:1px solid #303030;margin-top:12px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pinkLight));transition:.25s}
.progressText{margin-top:8px;color:var(--muted);font-size:.84rem}
.sectionTitle{margin:18px 2px 10px;font-size:.95rem;font-weight:900;color:var(--pinkLight);letter-spacing:.05em}
.emptyCard{background:linear-gradient(180deg,#111,#0b0b0b);border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:16px;margin:10px 0;padding:22px 16px;color:var(--muted);text-align:center;font-weight:800;line-height:1.5}
.emptyCard strong{display:block;color:var(--pinkLight);font-size:1rem;margin-bottom:6px}
.card{background:linear-gradient(180deg,#111,#0b0b0b);border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:16px;margin:10px 0;overflow:hidden}
.cardTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:14px 14px 8px}
.exerciseName{font-weight:900;font-size:1rem}.target{color:var(--pinkLight);font-size:.86rem;font-weight:800;margin-top:4px}
.loadBox{background:var(--panel2);border:1px solid #383838;border-radius:10px;display:flex;align-items:center;gap:6px;padding:6px 8px;flex:0 0 auto}
.loadBox input{width:58px;background:transparent;border:none;color:var(--text);font-weight:900;text-align:center;font-size:1rem;outline:none}.loadBox span{color:var(--muted);font-size:.78rem}
.sets{padding:0 12px 12px;display:grid;gap:8px}.setRow{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;background:var(--panel2);border:1px solid #2d2d2d;border-radius:12px;padding:8px}.setLabel{color:var(--muted);font-size:.8rem;font-weight:700}.setBtn{border:1px solid #6e2d4c;background:#211019;color:var(--pinkLight);border-radius:9px;padding:10px 8px;font-weight:900;cursor:pointer}.setBtn.done{background:rgba(61,220,132,.14);border-color:var(--ok);color:#a7f1c5}.note{margin:0 14px 14px;color:var(--muted);font-size:.8rem;line-height:1.4}
.timerPanel{position:fixed;left:0;right:0;bottom:0;background:rgba(5,5,5,.98);backdrop-filter:blur(10px);border-top:1px solid #343434;z-index:60;padding:10px 12px}.timerInner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.timerMain{font-size:1.18rem;font-weight:900}.timerMain small{display:block;color:var(--muted);font-size:.7rem;font-weight:600}.tbtn{border:none;border-radius:11px;padding:11px 12px;font-weight:900;cursor:pointer}.tbtn.pink{background:linear-gradient(180deg,#ff92c5,#ff5ca8);color:#230513}
@media (max-width:620px){.tabs{grid-template-columns:repeat(2,1fr)}.tab{font-size:.7rem;padding:10px 3px}h1{font-size:1.42rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="tabs" id="tabs"></div></div>
  <div id="app"></div>
</div>
<div class="timerPanel"><div class="timerInner"><div class="timerMain"><span id="timer">02:00</span><small>INTERVALO</small></div><button class="tbtn pink" id="startBtn" onclick="toggleTimer()">INICIAR</button></div></div>
<script>
const workouts={
 A:{tab:'TREINO A',label:'TREINO A - PORTÃO',exercises:[]},
 B:{tab:'TREINO B',label:'TREINO B - SÃO LÉO',exercises:[]},
 Q:{tab:'TREINO CASA',label:'TREINO CASA',exercises:[]},
 C:{tab:'TREINO C',label:'TREINO C - PORTÃO',exercises:[]},
 D:{tab:'TREINO D',label:'TREINO D - SÃO LÉO',exercises:[]},
 S:{tab:'SÁBADO',label:'SÁBADO',exercises:[]}
};
const order=['A','B','Q','C','D','S'];
let current='A';
function buildTabs(){const host=document.getElementById('tabs');host.innerHTML='';order.forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===current?' active':'');b.textContent=workouts[k].tab;b.onclick=()=>{current=k;render();window.scrollTo({top:0,behavior:'smooth'})};host.appendChild(b)})}
function render(){buildTabs();const w=workouts[current],app=document.getElementById('app');app.innerHTML=`<div class="hero"><h1>${w.label}</h1><div class="subtitle">TAF — JÉSSICA</div><div class="progress"><div class="bar" id="progressBar"></div></div><div class="progressText">0% CONCLUÍDO</div></div><div class="sectionTitle">EXERCÍCIOS</div><div class="emptyCard"><strong>AGUARDANDO TREINO</strong>OS EXERCÍCIOS DESTA ABA SERÃO ADICIONADOS DEPOIS.</div>`}
let remaining=120,timerInt=null,running=false;
function renderTimer(){const m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`}
function startTimer(){if(timerInt)clearInterval(timerInt);running=true;document.getElementById('startBtn').textContent='PAUSAR';timerInt=setInterval(()=>{if(remaining>0){remaining--;renderTimer()}else{clearInterval(timerInt);timerInt=null;running=false;document.getElementById('startBtn').textContent='INICIAR';if(navigator.vibrate)navigator.vibrate([180,120,180])}},1000)}
function toggleTimer(){if(running){clearInterval(timerInt);timerInt=null;running=false;document.getElementById('startBtn').textContent='INICIAR'}else startTimer()}
render();renderTimer();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}</script>
</body>
</html>
